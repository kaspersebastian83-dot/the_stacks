function uniq(arr){return [...new Set((arr||[]).map(s=>String(s||'').trim()).filter(Boolean))];}

  function setF(k,v){setFilters({...filters,[k]:v})}function clearFilters(){setFilters(defaultFilters);setSelected([])}function saveView(){const name=prompt('Name this saved view:');if(!name)return;setSavedViews(v=>[...v.filter(x=>x.name!==name),{id:genId(),name,filters:{...filters}}]);setViewsOpen(true)}function delView(id){setSavedViews(v=>v.filter(x=>x.id!==id));}function applyBulk(){if(!selected.length)return;const changes={};if(bulkStatus)changes.status=bulkStatus;if(bulkCollection)changes.addCollection=bulkCollection;if(bulkTag.trim())changes.addTag=bulkTag.trim();if(bulkRoom||bulkBookcase||bulkShelf)changes.location={room:bulkRoom,bookcase:bulkBookcase,shelf:bulkShelf};if(!Object.keys(changes).length)return;onBulkUpdate(selected,changes);setBulkStatus('');setBulkCollection('');setBulkTag('');setBulkRoom('');setBulkBookcase('');setBulkShelf('');}function toggleAll(){const ids=visible.map(b=>b.id);setSelected(selected.length===ids.length?[]:ids)}const activeFilterCount=Object.entries(filters).filter(([k,v])=>Boolean(v)&&k!=='query').length;
  return <div className="workspace library-shell"><div className="library-topbar"><div><div className="overline">Library</div><h1 className="title">Books</h1><p className="subtitle">A quiet, search-first catalog view. Open a book for details; filter by custom shelf, author, publisher, genre, tag, or location when needed.</p></div><div style={{display:'flex',gap:8,flexWrap:'wrap'}}><button className="ghost" onClick={()=>onExport(visible,'visible')}>Export visible</button><button className="ghost" onClick={saveView}>Save view</button></div></div><section className="panel panel-pad"><div className="library-search-row"><input className="field" placeholder="Search title, author, ISBN, tag, shelf, location..." value={filters.query} onChange={e=>setF('query',e.target.value)}/><button className="ghost" onClick={()=>setFiltersOpen(v=>!v)}><Icon name="filter" size={13}/> Filters{activeFilterCount?` · ${activeFilterCount}`:''}</button><button className="ghost" onClick={()=>setViewsOpen(v=>!v)}>Views</button></div><div className="small" style={{marginTop:10}}>Showing <b>{Math.min(rowsToShow.length,visible.length)}</b> of {visible.length} matching books · {books.length} total. {filters.query!==debouncedQuery?' Filtering shortly…':''} {selected.length?`${selected.length} selected.`:''}</div>{filtersOpen&&<div className="filter-panel" style={{marginTop:12}}><div className="filter-grid-minimal"><select className="select" value={filters.status} onChange={e=>setF('status',e.target.value)}><option value="">Any status</option>{STATUS.map(([id,l])=><option key={id} value={id}>{l}</option>)}</select><select className="select" value={filters.collection} onChange={e=>setF('collection',e.target.value)}><option value="">Any shelf</option><option value="__unshelved__">Unshelved</option>{collections.map(c=><option key={c} value={c}>{c}</option>)}</select><select className="select" value={filters.tag} onChange={e=>setF('tag',e.target.value)}><option value="">Any tag</option>{tags.map(t=><option key={t} value={t}>{t}</option>)}</select><select className="select" value={filters.room} onChange={e=>setF('room',e.target.value)}><option value="">Any room</option>{rooms.map(r=><option key={r} value={r}>{r}</option>)}</select><select className="select" value={filters.review} onChange={e=>setF('review',e.target.value)}><option value="">Any review state</option><option value="needs">Needs review</option><option value="reviewed">Reviewed</option></select><select className="select" value={filters.missing} onChange={e=>setF('missing',e.target.value)}><option value="">Any completeness</option><option value="cover">Missing cover</option><option value="author">Missing author</option><option value="location">Missing location</option><option value="duplicates">Possible duplicates</option></select><select className="select" value={filters.lent} onChange={e=>setF('lent',e.target.value)}><option value="">Any loan state</option><option value="out">Currently lent out</option><option value="overdue">Overdue</option><option value="returned">Returned before</option><option value="notlent">Never lent / not lent</option></select><select className="select" value={filters.minRating} onChange={e=>setF('minRating',e.target.value)}><option value="">Any rating</option><option value="0">Unrated</option><option value="1">★ 1+</option><option value="2">★ 2+</option><option value="3">★ 3+</option><option value="4">★ 4+</option><option value="5">★ 5</option></select></div><div style={{display:'flex',gap:8,flexWrap:'wrap'}}><button className="ghost" onClick={clearFilters}>Clear filters</button><button className="ghost" onClick={()=>setFiltersOpen(false)}>Done</button></div></div>}{viewsOpen&&<div className="filter-panel" style={{marginTop:12}}><div className="library-view-chips"><span className="small" style={{alignSelf:'center'}}>Quick views:</span>{BUILTIN_VIEWS.map(v=><button key={v.name} className="chip" onClick={()=>{setFilters({...defaultFilters,...v.filters});setViewsOpen(false)}}>{v.name}</button>)}</div><div className="library-view-chips"><span className="small" style={{alignSelf:'center'}}>Saved views:</span>{savedViews.length?savedViews.map(v=><span key={v.id} className="chip"><button style={{all:'unset',cursor:'pointer'}} onClick={()=>{setFilters({...defaultFilters,...v.filters});setViewsOpen(false)}}>{v.name}</button><button style={{all:'unset',cursor:'pointer'}} onClick={()=>delView(v.id)}>×</button></span>):<span className="small">None yet</span>}</div></div>}{selected.length>0&&<div className="filter-panel" style={{marginTop:12}}><b>Bulk edit selected books</b><div className="filter-grid-minimal"><select className="select" value={bulkStatus} onChange={e=>setBulkStatus(e.target.value)}><option value="">Status: no change</option>{STATUS.map(([id,l])=><option key={id} value={id}>{l}</option>)}</select><select className="select" value={bulkCollection} onChange={e=>setBulkCollection(e.target.value)}><option value="">Shelf: no change</option>{collections.map(c=><option key={c} value={c}>{c}</option>)}</select><input className="field" value={bulkTag} onChange={e=>setBulkTag(e.target.value)} placeholder="Add tag"/><input className="field" value={bulkRoom} onChange={e=>setBulkRoom(e.target.value)} placeholder="Room"/><input className="field" value={bulkBookcase} onChange={e=>setBulkBookcase(e.target.value)} placeholder="Bookcase"/><input className="field" value={bulkShelf} onChange={e=>setBulkShelf(e.target.value)} placeholder="Shelf"/></div><div style={{display:'flex',gap:8,flexWrap:'wrap'}}><button className="btn" onClick={applyBulk}>Apply</button><button className="ghost" onClick={()=>onBulkUpdate(selected,{reviewed:true})}>Mark reviewed</button><button className="ghost" onClick={()=>onBulkRetryMetadata(selected)}>Retry metadata</button><button className="ghost" onClick={()=>onExport(selectedBooks,'selected')}>Export selected</button><button className="ghost danger" onClick={()=>onBulkDelete(selected)}>Delete selected</button><button className="ghost" onClick={()=>setSelected([])}>Clear selection</button></div></div>}</section><BookTable books={rowsToShow} selected={selected} setSelected={setSelected} onEdit={onEdit} onQuickEdit={onQuickEdit} onToggleAll={toggleAll}/>{visible.length>rowsToShow.length&&<div className="load-more-row"><button className="ghost" onClick={()=>setVisibleLimit(n=>n+200)}>Load 200 more ({visible.length-rowsToShow.length} remaining)</button></div>}</div>;
}

function BookTable({books,selected,setSelected,onEdit,onQuickEdit,onToggleAll}){

  return <div className="clean-list" role="list" aria-label="Library books"><div style={{display:'flex',alignItems:'center',gap:8,padding:'0 4px'}}><input type="checkbox" checked={allChecked} onChange={onToggleAll} aria-label="Select all visible books"/><span className="small">Select visible books</span></div>{books.length?books.map(b=><div key={b.id} className="clean-row" role="listitem"><input type="checkbox" aria-label={'Select '+b.title} checked={selected.includes(b.id)} onChange={()=>toggle(b.id)} onClick={e=>e.stopPropagation()}/><div className="cover-mini">{b.cover?<img loading="lazy" src={b.cover} alt="" style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:3}}/>:<Icon name="book" size={18}/>}</div><button className="clean-row-main" onClick={()=>onEdit(b)}><b className="truncate">{b.title}</b><span className="truncate">{b.authors||'Unknown author'} · {collectionNames(b).join(', ')||'Unshelved'}{locationText(b)?' · '+locationText(b):''}</span></button><div className="clean-row-meta"><span className="chip gray">{statusLabel(b.status)}</span>{needsReview(b,books)&&<span className="chip warn">Review</span>}{isLentOut(b)&&<span className={isOverdue(b)?'chip bad':'chip warn'}>{isOverdue(b)?'Overdue':'Lent'}</span>}</div><details className="row-menu"><summary aria-label={'More actions for '+b.title}>⋯</summary><div className="row-menu-pop"><button onClick={()=>onEdit(b)}>Open details</button><button onClick={()=>onQuickEdit?.(b)}>Quick edit</button></div></details></div>):<div className="clean-empty">No books match this view.</div>}</div>;

function NeedsReviewView({books,onEdit,onMarkReviewed,onRetryMetadata,onPreviewMetadata,onGoDuplicates}){const items=books.filter(b=>needsReview(b,books));const dupCount=duplicateGroups(books).reduce((n,g)=>n+g.items.length,0);return <div className="workspace"><div className="overline">Needs Review</div><h1 className="title">Cleanup inbox</h1><p className="subtitle">Records appear here when metadata, cover, location, ISBN, or duplicate checks need attention. Retry metadata from ISBNs without leaving the inbox.</p><div style={{display:'flex',gap:8,marginTop:14,flexWrap:'wrap'}}><button className="ghost" onClick={onGoDuplicates}>Open duplicate review {dupCount?`(${dupCount})`:''}</button><button className="ghost" onClick={()=>items.length&&onMarkReviewed(items.map(b=>b.id))}>Mark all visible reviewed</button><button className="ghost" onClick={()=>items.length&&onRetryMetadata(items.map(b=>b.id))}>Retry metadata for visible</button></div><div className="panel" style={{marginTop:14,overflow:'hidden'}}>{items.length?items.map(b=><div key={b.id} className="tr" style={{gridTemplateColumns:'minmax(180px,2fr) minmax(180px,1.4fr) repeat(3,max-content)',display:'grid'}}><button style={{all:'unset',cursor:'pointer',textAlign:'left'}} onClick={()=>onEdit(b)}><b>{b.title}</b><div className="small">{b.authors||'Unknown author'} · {b.isbn||'No ISBN'}</div></button><div style={{display:'flex',flexWrap:'wrap',gap:5}}>{reviewReasons(b,books).map(r=><span key={r} className="chip warn">{r}</span>)}</div><button className="ghost" onClick={()=>onPreviewMetadata(b.id)}>Preview metadata</button><button className="ghost" onClick={()=>onRetryMetadata([b.id])}>Fill missing</button><button className="ghost" onClick={()=>onMarkReviewed([b.id])}>Mark reviewed</button></div>):<div className="empty">All clear. No books currently need review.</div>}</div></div>}

function FieldMergeModal({group,onClose,onApply}){
  const items=group.items||[];
  const primary=items[0];
  const [draft,setDraft]=useState(()=>mergeBookRecords(primary,items.slice(1)));
  const pick=(field,value)=>setDraft(p=>normalizeBook({...p,[field]:value}));
  const pickLocation=b=>setDraft(p=>normalizeBook({...p,location:normalizeLocation(b.location)}));
  const pickCollections=b=>setDraft(p=>setBookCollections(p,uniq([...collectionNames(p),...collectionNames(b)])));
  const pickTags=b=>setDraft(p=>normalizeBook({...p,tags:uniq([...(p.tags||[]),...(b.tags||[])])}));
  const fields=[['title','Title'],['authors','Author(s)'],['isbn','ISBN'],['year','Year'],['publisher','Publisher'],['pages','Pages'],['edition','Edition'],['format','Format'],['language','Language'],['condition','Condition'],['cover','Cover URL'],['notes','Notes'],['privateReview','Private review'],['copyNotes','Copy notes']];
  const removeIds=items.filter(b=>b.id!==draft.id).map(b=>b.id);
  return <div className="modal-back" onClick={onClose}>
    <div className="modal" style={{maxWidth:980}} onClick={e=>e.stopPropagation()}>
      <div className="modal-head">
        <div><div className="overline">Field-by-field merge</div><h2 style={{fontFamily:'Fraunces,serif',margin:'2px 0 0'}}>Choose the best values</h2></div>
        <button className="ghost" onClick={onClose}><Icon name="x" size={14}/></button>
      </div>
      <div className="modal-body">
        <p className="subtitle" style={{marginTop:0}}>Pick the best values before merging. Shelves and tags can be accumulated from multiple records.</p>
        <div style={{display:'grid',gridTemplateColumns:'220px 1fr',gap:14}}>
          <div>
            <div className="label">Preview</div>
            <div className="cover" style={{width:120,height:180,marginBottom:10}}>{draft.cover?<img loading="lazy" src={draft.cover}/>:<Icon name="book" size={32}/>}</div>
            <b>{draft.title}</b>
            <div className="small">{draft.authors||'Unknown author'}</div>
            <div className="small">Quality: {metadataScore(draft,items)}% · {qualityLabel(metadataScore(draft,items))}</div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:8}}>
              {collectionNames(draft).map(c=><span key={c} className="chip gray">{c}</span>)}
              {(draft.tags||[]).map(t=><span key={t} className="chip">{t}</span>)}
            </div>
          </div>
          <div style={{display:'grid',gap:10}}>
            {fields.map(([field,label])=>{
              const options=mergeValueOptions(items,field);
              return <div key={field} style={{borderBottom:'1px solid var(--line)',paddingBottom:8}}>
                <div className="label">{label}</div>
                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                  {options.length?options.map(v=><button key={String(v)} className={String(draft[field]||'')===String(v)?'chip good':'chip'} onClick={()=>pick(field,v)}>{String(v).slice(0,110)}</button>):<span className="small">No value</span>}
                </div>
              </div>
            })}
            <div style={{borderBottom:'1px solid var(--line)',paddingBottom:8}}>
              <div className="label">Location</div>
              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>{items.map(b=><button key={b.id} className="chip" onClick={()=>pickLocation(b)}>{locationText(b)||'No location'} · {(b.title||'').slice(0,24)}</button>)}</div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              <div><div className="label">Accumulate shelves</div><div style={{display:'flex',gap:6,flexWrap:'wrap'}}>{items.map(b=><button key={b.id} className="chip" onClick={()=>pickCollections(b)}>{collectionNames(b).join(', ')||'Unshelved'}</button>)}</div></div>
              <div><div className="label">Accumulate tags</div><div style={{display:'flex',gap:6,flexWrap:'wrap'}}>{items.map(b=><button key={b.id} className="chip" onClick={()=>pickTags(b)}>{(b.tags||[]).join(', ')||'No tags'}</button>)}</div></div>
            </div>
          </div>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',gap:8,marginTop:16}}>
          <button className="ghost" onClick={onClose}>Cancel</button>
          <button className="btn" onClick={()=>onApply(normalizeBook({...draft,reviewed:false,updatedAt:new Date().toISOString()}),removeIds)}>Merge using selected values</button>
        </div>
      </div>
    </div>
  </div>;
}

function DuplicateReviewView({books,onEdit,onMergeGroup,onMergeCustom,onDeleteIds}){
  const groups=useMemo(()=>duplicateGroups(books),[books]);
  const [compare,setCompare]=useState(null);
  return <div className="workspace">
    <div className="overline">Duplicate Review</div>
    <h1 className="title">Possible duplicates</h1>
    <p className="subtitle">Review same physical copy IDs, same editions or ISBNs, and same title/author groups. Same-edition physical copies are shown here for visibility, but should usually be kept as separate copies unless one was scanned by mistake.</p>
    {groups.length?<div style={{display:'grid',gap:14,marginTop:14}}>{groups.map(group=>{const copyGroup=group.kind==='copy'||group.kind==='edition';return <div key={group.key} className="panel panel-pad">
      <div style={{display:'flex',justifyContent:'space-between',gap:12,alignItems:'center',marginBottom:10}}>
        <div><b>{group.label}</b><div className="small">{group.items.length} record{group.items.length===1?'':'s'} · {group.items[0].title}</div></div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>{copyGroup?<span className="chip warn">Physical copy group</span>:<><button className="ghost" onClick={()=>setCompare(group)}>Compare fields</button><button className="btn" onClick={()=>onMergeGroup(group.items[0].id,group.items.slice(1).map(b=>b.id))}>Merge into newest</button></>}</div>
      </div>
      <div style={{display:'grid',gap:8}}>{group.items.map((b,i)=><div key={b.id} className="tr" style={{gridTemplateColumns:'2fr 1.3fr .8fr 1fr auto auto',display:'grid'}}>
        <button style={{all:'unset',cursor:'pointer',textAlign:'left'}} onClick={()=>onEdit(b)}><b>{copyGroup?'Copy: ':i===0?'Primary: ':''}{b.title}</b><div className="small">{b.isbn||'No ISBN'} · {locationText(b)||'No location'} · {b.addedAt?new Date(b.addedAt).toLocaleDateString():''}</div></button>
        <div className="truncate">{b.authors||'Unknown'}</div>
        <div>{b.rating?'★ '+b.rating:'-'}</div>
        <div><span className={metadataScore(b,books)>=70?'chip good':metadataScore(b,books)>=50?'chip warn':'chip bad'}>{metadataScore(b,books)}%</span></div>
        {copyGroup?<button className="ghost" onClick={()=>onEdit(b)}>Open copy</button>:<button className="ghost" onClick={()=>onMergeGroup(b.id,group.items.filter(x=>x.id!==b.id).map(x=>x.id))}>Use as primary</button>}
        {i>0?<button className="ghost danger" onClick={()=>onDeleteIds([b.id])}>Remove</button>:<span/>}
      </div>)}</div>
    </div>})}</div>:<div className="panel empty" style={{marginTop:14}}>No duplicate groups found.</div>}
    {compare&&<FieldMergeModal group={compare} onClose={()=>setCompare(null)} onApply={(merged,removeIds)=>{onMergeCustom(merged,removeIds);setCompare(null)}}/>}
  </div>;
}

function QualityView({books,onEdit,onRetryMetadata,onPreviewMetadata,onFillCovers,onMarkReviewed,onOpenDuplicates}){
  const rows=useMemo(()=>books.map(b=>({book:b,score:metadataScore(b,books),problems:qualityProblems(b,books)})).sort((a,b)=>a.score-b.score||a.book.title.localeCompare(b.book.title)),[books]);
  const poor=rows.filter(r=>r.score<50);
  const fair=rows.filter(r=>r.score>=50&&r.score<70);
  const missingCover=rows.filter(r=>!r.book.cover);
  const canEnrich=rows.filter(r=>(r.book.isbn&&isValidISBN(r.book.isbn))||r.book.title||r.book.authors);
  const works=workGroups(books).filter(g=>g.isbnCount>1||g.editionCount>1).slice(0,12);
  const avg=books.length?Math.round(rows.reduce((n,r)=>n+r.score,0)/books.length):100;
  return <div className="workspace">
    <div className="overline">Phase 6 · Quality</div>
    <h1 className="title">Metadata intelligence</h1>
    <p className="subtitle">Prioritize cleanup, enrich records, fill cover placeholders, and spot possible work or edition groups.</p>
    <div className="grid3" style={{marginTop:14}}>{[['Average quality',avg+'%'],['Poor records',poor.length],['Fair records',fair.length],['Missing covers',missingCover.length],['Enrichable records',canEnrich.length],['Work groups',works.length]].map(([l,v])=><div className="stat" key={l}><strong>{v}</strong><span>{l}</span></div>)}</div>
    <div className="panel panel-pad" style={{marginTop:14}}>
      <h2 style={{fontFamily:'Fraunces,serif',marginTop:0}}>Smart cleanup actions</h2>
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}><button className="ghost" onClick={()=>onRetryMetadata(rows.filter(r=>r.score<70).slice(0,40).map(r=>r.book.id))}>Enrich low-quality records</button><button className="ghost" onClick={()=>onRetryMetadata(canEnrich.slice(0,40).map(r=>r.book.id))}>Retry metadata for first 40 enrichable</button><button className="ghost" onClick={()=>onFillCovers(missingCover.map(r=>r.book.id))}>Fill ISBN cover URLs</button><button className="ghost" onClick={()=>onMarkReviewed(rows.filter(r=>r.score>=85&&!r.problems.length).map(r=>r.book.id))}>Mark high-quality records reviewed</button><button className="ghost" onClick={onOpenDuplicates}>Open duplicate review</button></div>
      <p className="small">Metadata retry uses ISBN first and then title + author search when ISBN is missing.</p>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'minmax(320px,1.25fr) minmax(280px,.75fr)',gap:14,marginTop:14}}>
      <section className="panel" style={{overflow:'hidden'}}>
        <div className="th" style={{gridTemplateColumns:'90px 2fr 1.2fr 1.8fr auto'}}><div>Quality</div><div>Title</div><div>Author</div><div>Problems</div><div>Action</div></div>
        {rows.slice(0,60).map(({book,score,problems})=><div key={book.id} className="tr" style={{gridTemplateColumns:'90px 2fr 1.2fr 1.8fr auto',display:'grid'}}><div><span className={score>=70?'chip good':score>=50?'chip warn':'chip bad'}>{score}%</span></div><button style={{all:'unset',cursor:'pointer',textAlign:'left'}} onClick={()=>onEdit(book)}><b>{book.title}</b><div className="small">{book.isbn||'No ISBN'} · {qualityLabel(score)}</div></button><div className="truncate">{book.authors||'Unknown'}</div><div style={{display:'flex',gap:5,flexWrap:'wrap'}}>{problems.slice(0,4).map(p=><span key={p} className="chip warn">{p}</span>)}</div><div style={{display:'flex',gap:6,flexWrap:'wrap'}}><button className="ghost" onClick={()=>onPreviewMetadata(book.id)}>Preview</button><button className="ghost" onClick={()=>onRetryMetadata([book.id])}>Fill missing</button></div></div>)}
      </section>
      <section className="panel panel-pad"><h2 style={{fontFamily:'Fraunces,serif',marginTop:0}}>Possible work / edition groups</h2><p className="small">These are not necessarily duplicates. They may be different editions or copies of the same work.</p>{works.length?works.map(g=><div key={g.key} style={{borderTop:'1px solid var(--line)',padding:'9px 0'}}><b>{g.label}</b><div className="small">{g.items.length} records · {g.isbnCount||'no'} ISBNs · {g.editionCount||'no'} edition markers</div><div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:5}}>{g.items.slice(0,5).map(b=><button key={b.id} className="chip" onClick={()=>onEdit(b)}>{b.year||'no year'} · {b.format||'format?'}</button>)}</div></div>):<div className="small">No likely work groups found yet.</div>}</section>
    </div>
  </div>;
}

function BookcaseView({books,collections,activeCollection,search,onEdit,onDropBook,setDragging,onAddCollection,setActiveCollection,onRemoveFromCollection,onOpenSettings}){
  const [newShelf,setNewShelf]=useState('');
  const [dropTarget,setDropTarget]=useState('');
  const [mode,setMode]=useState('move');
  const q=String(search||'').toLowerCase();
  const safeBooks=(books||[]).filter(b=>b&&typeof b==='object');
  const visibleCollections=activeCollection&&activeCollection!=='__unshelved__'?[activeCollection]:(activeCollection==='__unshelved__'?[]:collections);
  const displayBooks=safeBooks.filter(b=>matches(b,q,safeBooks));
  const unshelvedBooks=displayBooks.filter(isUnshelved);
  const issues=catalogIssues(books,collections);
  const targetLabel=activeCollection&&activeCollection!=='__unshelved__'?activeCollection:(activeCollection==='__unshelved__'?'Unshelved':'All shelves');
  const createShelf=()=>{const v=newShelf.trim();if(!v)return;onAddCollection?.(v);setActiveCollection?.(v);setNewShelf('');};
  const dropTo=(target,e)=>{e.preventDefault();e.stopPropagation();const id=e.dataTransfer.getData('bookId');if(id)onDropBook(id,target,mode);setDropTarget('');};
  const allowDrop=(target,e)=>{e.preventDefault();setDropTarget(target||'__unshelved__');};

function IntakeQueueView({books,collections,onEdit,onBulkIntakeUpdate,setActiveView,setFilters}){
  const safe=(books||[]).filter(b=>b&&typeof b==='object');
  const today=todayISO();
  const [scope,setScope]=useState('queue');
  const [selected,setSelected]=useState([]);
  const [target,setTarget]=useState('');
  const [mode,setMode]=useState('move');
  const [status,setStatus]=useState('');
  const [markReviewed,setMarkReviewed]=useState(false);
  const [loc,setLoc]=useState({room:'',bookcase:'',shelf:'',box:''});
  const recentCutoff=Date.now()-14*86400000;
  const queue=safe.filter(b=>isUnshelved(b)||needsReview(b,safe)||String(b.addedAt||'').slice(0,10)===today);
  const recent=safe.filter(b=>{const t=new Date(b.addedAt||0).getTime();return Number.isFinite(t)&&t>=recentCutoff;});
  const source=scope==='unshelved'?safe.filter(isUnshelved):scope==='today'?safe.filter(b=>String(b.addedAt||'').slice(0,10)===today):scope==='review'?safe.filter(b=>needsReview(b,safe)):scope==='recent'?recent:queue;
  const rows=[...source].sort((a,b)=>(b.addedAt||'').localeCompare(a.addedAt||''));
  useEffect(()=>setSelected(s=>s.filter(id=>rows.some(b=>b.id===id))),[scope,books.length]);
  const toggle=id=>setSelected(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const toggleAll=()=>setSelected(selected.length===rows.length?[]:rows.map(b=>b.id));
  const openLibrary=filters=>{setFilters({...defaultFilters,...filters});setActiveView('library');};
  function apply(){
    if(!selected.length)return;
    const changes={mode};
    if(target)changes.collection=target;
    if(status)changes.status=status;
    if(markReviewed)changes.reviewed=true;
    if(loc.room||loc.bookcase||loc.shelf||loc.box)changes.location=loc;
    if(!target&&!status&&!markReviewed&&!changes.location)return;
    onBulkIntakeUpdate(selected,changes);
    setSelected([]);
  }
  return <div className="workspace intake-shell"><div><div className="overline">Intake queue</div><h1 className="title">Organize new books faster</h1><p className="subtitle">Use this queue after scanning, importing, or manual entry. Select several books, then move or add them to a custom shelf, assign location, set status, or mark reviewed.</p></div>
    <div className="intake-summary">{[['Queue',queue.length],['Unshelved',safe.filter(isUnshelved).length],['Added today',safe.filter(b=>String(b.addedAt||'').slice(0,10)===today).length],['Needs review',safe.filter(b=>needsReview(b,safe)).length],['Recent 14 days',recent.length]].map(([label,value])=><div className="stat" key={label}><strong>{value}</strong><span>{label}</span></div>)}</div>
    <section className="panel panel-pad"><div className="intake-toolbar"><label><div className="label">Show</div><select className="select" value={scope} onChange={e=>{setScope(e.target.value);setSelected([])}}><option value="queue">Smart queue</option><option value="unshelved">Unshelved only</option><option value="today">Added today</option><option value="review">Needs review</option><option value="recent">Recent 14 days</option></select></label><button className="ghost" onClick={toggleAll} disabled={!rows.length}>{rows.length&&selected.length===rows.length?'Clear selection':'Select all shown'}</button><button className="ghost" onClick={()=>openLibrary({collection:'__unshelved__'})}>Open unshelved in Library</button><button className="ghost" onClick={()=>setActiveView('bookcase')}>Open Bookcase</button></div><div className="small" style={{marginTop:10}}>Showing <b>{rows.length}</b> book{rows.length===1?'':'s'} · {selected.length} selected.</div></section>
    <div className="intake-list">{rows.length?rows.map(b=><div key={b.id} className="intake-row"><input type="checkbox" checked={selected.includes(b.id)} onChange={()=>toggle(b.id)} aria-label={'Select '+(b.title||'book')}/><div className="cover-mini">{b.cover?<img loading="lazy" src={b.cover} alt="" style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:3}}/>:<Icon name="book" size={18}/>}</div><button className="intake-row-main" onClick={()=>onEdit(b)}><b className="truncate">{b.title||'Untitled book'}</b><span className="truncate">{b.authors||'Unknown author'} · {collectionNames(b).join(', ')||'Unshelved'}{locationText(b)?' · '+locationText(b):''}</span></button><div className="clean-row-meta"><span className="chip gray">{statusLabel(b.status)}</span>{needsReview(b,safe)&&<span className="chip warn">Review</span>}{String(b.addedAt||'').slice(0,10)===today&&<span className="chip good">Today</span>}</div></div>):<div className="clean-empty">No books in this queue.</div>}</div>
    {selected.length>0&&<section className="intake-bulkbar" aria-label="Bulk intake actions"><label><div className="label">Shelf action</div><select className="select" value={mode} onChange={e=>setMode(e.target.value)}><option value="move">Move to shelf</option><option value="add">Add shelf, keep existing</option></select></label><label><div className="label">Target shelf</div><select className="select" value={target} onChange={e=>setTarget(e.target.value)}><option value="">No shelf change</option>{collections.map(c=><option key={c} value={c}>{c}</option>)}</select></label><label><div className="label">Status</div><select className="select" value={status} onChange={e=>setStatus(e.target.value)}><option value="">No status change</option>{STATUS.map(([id,l])=><option key={id} value={id}>{l}</option>)}</select></label><label><div className="label">Reviewed</div><button className={markReviewed?'chip good':'chip'} onClick={()=>setMarkReviewed(v=>!v)}>{markReviewed?'Will mark reviewed':'Leave review state'}</button></label><input className="field" placeholder="Room" value={loc.room} onChange={e=>setLoc(p=>({...p,room:e.target.value}))}/><input className="field" placeholder="Bookcase" value={loc.bookcase} onChange={e=>setLoc(p=>({...p,bookcase:e.target.value}))}/><input className="field" placeholder="Shelf" value={loc.shelf} onChange={e=>setLoc(p=>({...p,shelf:e.target.value}))}/><input className="field" placeholder="Box" value={loc.box} onChange={e=>setLoc(p=>({...p,box:e.target.value}))}/><button className="btn" onClick={apply}>Apply to {selected.length}</button><button className="ghost" onClick={()=>setSelected([])}>Clear</button></section>}
  </div>;
}

function TagManager({books,onRename,onMerge,onDelete}){const tags=useMemo(()=>uniq(books.flatMap(b=>b.tags||[])).sort(),[books]);const [selected,setSelected]=useState('');const [newName,setNewName]=useState('');const [mergeInto,setMergeInto]=useState('');const count=t=>books.filter(b=>(b.tags||[]).includes(t)).length;return <div className="workspace"><div className="overline">Tag Manager</div><h1 className="title">Clean up tags</h1><p className="subtitle">Tags are flexible descriptors. They stay separate from custom shelves and can be renamed, merged, or removed across the catalog.</p><div className="grid2" style={{marginTop:14}}><div className="panel panel-pad"><h2 style={{marginTop:0,fontFamily:'Fraunces,serif'}}>All tags</h2>{tags.length?<div style={{display:'flex',flexWrap:'wrap',gap:8}}>{tags.map(t=><button key={t} className={'chip '+(selected===t?'good':'')} onClick={()=>{setSelected(t);setNewName(t);setMergeInto('')}}>{t} <span className="mono">{count(t)}</span></button>)}</div>:<div className="small">No tags yet.</div>}</div><div className="panel panel-pad"><h2 style={{marginTop:0,fontFamily:'Fraunces,serif'}}>Edit selected tag</h2>{selected?<><div className="label">Selected</div><div style={{marginBottom:10}}><span className="chip">{selected}</span> <span className="small">used by {count(selected)} book{count(selected)===1?'':'s'}</span></div><div className="label">Rename to</div><div style={{display:'flex',gap:8}}><input className="field" value={newName} onChange={e=>setNewName(e.target.value)}/><button className="btn" onClick={()=>{if(newName.trim())onRename(selected,newName.trim());setSelected(newName.trim())}}>Rename</button></div><div className="label" style={{marginTop:14}}>Merge into</div><div style={{display:'flex',gap:8}}><select className="select" value={mergeInto} onChange={e=>setMergeInto(e.target.value)}><option value="">Choose tag…</option>{tags.filter(t=>t!==selected).map(t=><option key={t} value={t}>{t}</option>)}</select><button className="ghost" onClick={()=>{if(mergeInto)onMerge(selected,mergeInto);setSelected('')}}>Merge</button></div><button className="ghost danger" style={{marginTop:14}} onClick={()=>{if(confirm(`Remove tag "${selected}" from all books?`)){onDelete(selected);setSelected('')}}}><Icon name="trash" size={13}/>Delete tag</button></>:<div className="small">Select a tag to edit it.</div>}</div></div></div>}



function CleanupAssistantView({books,setActiveView,setFilters,onExportJSON}){
  const s=cleanupSummary(books);const totalProblems=s.review.length+s.covers.length+s.locations.length+s.duplicates.length+s.quality.length;
  const steps=[
    {id:'review',title:'Fix broken records',count:s.review.length,detail:'Unknown titles, missing authors, invalid ISBNs, or records that still need review.',action:()=>setActiveView('review')},

    {id:'backup',title:'Export a recovery backup',count:0,detail:'Download JSON after cleanup. It preserves the full catalog better than CSV.',action:onExportJSON,always:true}
  ];
  const openStep=steps.find(st=>st.count>0)||steps[steps.length-1];const done=!totalProblems;const progress=Math.round(((steps.length-1-steps.filter(x=>x.count).length)/(steps.length-1))*100);
  return <div className="workspace"><div className="overline">Guided cleanup</div><h1 className="title">Cleanup assistant</h1><p className="subtitle">A safe, ordered path through the powerful maintenance tools. Start at the top, fix only one queue at a time, and finish with a JSON backup.</p><div className="calm-hero"><section className="next-action-card"><div className="overline">Next step</div><h2>{done?'Catalog looks healthy':openStep.title}</h2><p>{done?'No major cleanup queues are active. Download a JSON backup before large edits or imports.':openStep.detail}</p><div className="cleanup-meter"><span style={{width:progress+'%'}}/></div><div className="row-actions"><button className="btn" onClick={openStep.action}>{done?'Download backup':`Start: ${openStep.title}`}</button><button className="ghost" onClick={onExportJSON}>Backup now</button></div></section><section className="backup-card"><b>Safe cleanup rules</b><div className="small">1. Back up before imports or bulk edits. 2. Review duplicates before merging. 3. Use Preview metadata when changing external fields. 4. Finish by exporting JSON.</div><div className="row-actions"><button className="ghost" onClick={()=>setActiveView('settings')}>Safety settings</button><button className="ghost" onClick={onExportJSON}>Download JSON</button></div></section></div><div className="guided-steps">{steps.map((st,i)=><div key={st.id} className={'guided-step-row '+(st.count?'active':'done')}><div className="step-number">{i+1}</div><div><h3>{st.title}</h3><div className="small">{st.detail}</div></div><button className={st.id==='backup'?'btn':'ghost'} onClick={st.action}>{st.id==='backup'?'Backup':st.count?`${st.count} item${st.count===1?'':'s'}`:'Review'}</button></div>)}</div></div>;

function backupAgeLabel(settings){
  if(!settings?.lastBackupAt)return {label:'Not recorded',tone:'warn',detail:'Download a JSON backup before large edits.'};
  const t=new Date(settings.lastBackupAt).getTime();
  if(!Number.isFinite(t))return {label:'Unknown',tone:'warn',detail:'Backup date could not be read.'};
  const days=Math.floor((Date.now()-t)/86400000);
  if(days<=0)return {label:'Today',tone:'good',detail:'Fresh JSON backup recorded.'};
  if(days===1)return {label:'Yesterday',tone:'good',detail:'Recent JSON backup recorded.'};
  if(days<=14)return {label:`${days} days ago`,tone:'good',detail:'Backup is reasonably recent.'};
  return {label:`${days} days ago`,tone:'warn',detail:'Consider downloading a fresh JSON backup.'};
}
function SafetyStatusBanner({books,settings,onExportJSON,compact=false}){
  const backup=backupAgeLabel(settings);
  const destructive=settings?.confirmDestructive!==false;
  const snapshots=settings?.autoJsonSnapshot!==false;
  const tone=backup.tone==='warn'&&!books.length?'good':backup.tone;
  return <div className={'safety-strip '+tone}><div className="safety-strip-head"><div><b>Safety status</b><div className="small">{backup.detail} Destructive confirmations are {destructive?'on':'off'} and local safety snapshots are {snapshots?'on':'off'}.</div></div><button className="ghost" onClick={onExportJSON}>Download backup</button></div>{!compact&&<div className="safety-facts"><div className="safety-fact"><b>{backup.label}</b><span>Last JSON backup</span></div><div className="safety-fact"><b>{destructive?'On':'Off'}</b><span>Confirm deletes</span></div><div className="safety-fact"><b>{snapshots?'On':'Off'}</b><span>Local snapshots</span></div></div>}</div>;
}

  const max=Math.max(1,...byStatus.map(x=>x[1]),...byRoom.map(x=>x[1]),...byTag.map(x=>x[1]),...byAuthor.map(x=>x[1]));

}

e={13}/>Remove</button><div style={{display:'flex',gap:8}}><button className="ghost" onClick={onClose}>Cancel</button><button className="btn" onClick={()=>onSave(d)}><Icon name="save" size={13}/>Save entry</button></div></div></div></div>;

function StorageModePanel({storageMode,storageInfo,onEnableIndexedDB,onUseLocalStorage,onRepairIndexedDB,books,collections,savedViews,settings}){
  const perf=storageDiagnostics(books,collections,savedViews,settings);
  const quota=storageInfo?.quota||0;
  const usage=storageInfo?.usage||0;
  const quotaLabel=quota?`${formatBytes(usage)} / ${formatBytes(quota)}`:'not reported by browser';
  const modeLabel=storageMode==='indexeddb'?'Larger Library Mode (IndexedDB)':'Portable localStorage mode';
  const idbOk=idbAvailable();
  return <div className="workspace" style={{paddingTop:0}}><section className="panel panel-pad"><div className="overline">Storage engine</div><h2 style={{fontFamily:'Fraunces,serif',margin:'4px 0 6px'}}>Larger Library Mode</h2><p className="subtitle" style={{marginBottom:14}}>Use IndexedDB for larger catalogs while keeping JSON backup/restore as the safest portable format. Switching modes copies the current in-memory catalog; it does not delete the old storage copy automatically.</p><div className="grid3"><div className="stat"><strong style={{fontSize:18}}>{modeLabel}</strong><span>Current mode</span></div><div className="stat"><strong>{idbOk?'Available':'Unavailable'}</strong><span>IndexedDB</span></div><div className="stat"><strong style={{fontSize:18}}>{quotaLabel}</strong><span>Browser storage estimate</span></div><div className="stat"><strong>{formatBytes(perf.estimate)}</strong><span>localStorage footprint</span></div><div className="stat"><strong>{formatBytes(perf.backupBytes)}</strong><span>JSON backup estimate</span></div><div className="stat"><strong>{perf.embeddedCovers}</strong><span>Embedded covers</span></div></div><div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:14}}>{storageMode!=='indexeddb'?<button className="btn" disabled={!idbOk} onClick={onEnableIndexedDB}>Enable Larger Library Mode</button>:<button className="ghost" onClick={onUseLocalStorage}>Copy active catalog to localStorage mode</button>}{storageMode==='indexeddb'&&<button className="ghost" onClick={onRepairIndexedDB}>Rewrite / repair IndexedDB copy</button>}</div><ul className="diagnostic-list"><li>Always download a JSON backup before changing storage mode.</li><li>IndexedDB is better for larger catalogs and cover-heavy records, but the single-file app still needs browser access to this local database.</li><li>localStorage is more portable but has a much smaller practical limit.</li></ul></section></div>}


function WorksView({books,onEdit,onApplyV3,onExportV3,onPrintV3,setActiveView,setFilters}){
  const model=useMemo(()=>buildV3CatalogModel(books),[books]);
  const [query,setQuery]=useState('');
  const [selectedWork,setSelectedWork]=useState(null);
  const needle=query.toLowerCase().trim();
  const works=model.works.filter(w=>!needle||`${w.title} ${w.author} ${w.tags.join(' ')}`.toLowerCase().includes(needle)).slice(0,120);
  const active=selectedWork?model.byWork.get(selectedWork):works[0];
  const editions=active?model.editions.filter(e=>e.workId===active.id):[];
  const copies=active?model.copies.filter(c=>c.workId===active.id):[];
  const unstamped=books.filter(b=>!b?.workId||!b?.editionId||!b?.copyId).length;
  return <div className="workspace"><div className="overline">v3 catalog model</div><h1 className="title">Works, editions, and physical copies</h1><p className="subtitle">This workspace inspects the native catalog model. A work is the intellectual book, an edition is a publication, and a copy is the physical item you own.</p>
    <div className="grid3" style={{marginTop:14}}>{[['Works',model.works.length],['Editions',model.editions.length],['Physical copies',model.copies.length],['Legacy records',unstamped],['Multi-edition works',model.ambiguousWorks.length],['Duplicate/copy edition groups',model.duplicateEditions.length]].map(([label,value])=><div className="stat" key={label}><strong>{value}</strong><span>{label}</span></div>)}</div>
    <div className="backup-card" style={{marginTop:16}}><b>Native catalog model</b><div className="small">The app now stores the catalog as separate Works, Editions, and Physical Copies. The familiar Library list is a view generated from this native model.</div><div className="row-actions"><button className="btn" onClick={onApplyV3}>Rebuild native model</button><button className="ghost" onClick={onExportV3}>Export native model JSON</button><button className="ghost" onClick={onPrintV3}>Print inventory</button><button className="ghost" onClick={()=>setActiveView('duplicates')}>Open duplicate review</button></div></div>
    <div className="grid2" style={{gridTemplateColumns:'minmax(280px,.9fr) minmax(420px,1.4fr)',marginTop:16}}><section className="panel panel-pad"><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}><h2 style={{fontFamily:'Fraunces,serif',margin:'0'}}>Works</h2><input className="field" value={query} onChange={e=>setQuery(e.target.value)} placeholder="Filter works…" style={{maxWidth:180}}/></div><div style={{display:'grid',gap:6,marginTop:12}}>{works.length?works.map(w=><button key={w.id} className={'tr '+(active?.id===w.id?'active':'')} style={{gridTemplateColumns:'1fr 90px',textAlign:'left'}} onClick={()=>setSelectedWork(w.id)}><span><b>{w.title}</b><div className="small">{w.author||'Unknown author'} · {w.editionIds.length} edition{w.editionIds.length===1?'':'s'} · {w.copyIds.length} cop{w.copyIds.length===1?'y':'ies'}</div></span><span className="chip gray">{Math.round(w.quality||0)}%</span></button>):<div className="empty">No works matched.</div>}</div></section>
      <section className="panel panel-pad">{active?<><div style={{display:'flex',justifyContent:'space-between',gap:12,alignItems:'start'}}><div><div className="overline">Selected work</div><h2 style={{fontFamily:'Fraunces,serif',margin:'2px 0'}}>{active.title}</h2><div className="small">{active.author||'Unknown author'} · {active.tags.slice(0,6).join(', ')||'No work tags'}</div></div><button className="ghost" onClick={()=>{setFilters({...defaultFilters,search:`title:"${active.title.replace(/"/g,'')}"`});setActiveView('library')}}>Open in Library</button></div><h3>Editions</h3><div style={{display:'grid',gap:8}}>{editions.map(ed=>{const edCopies=model.copies.filter(c=>c.editionId===ed.id);return <div key={ed.id} className="panel panel-pad" style={{boxShadow:'none'}}><div style={{display:'grid',gridTemplateColumns:'58px 1fr auto',gap:10,alignItems:'center'}}>{ed.cover?<img loading="lazy" src={ed.cover} style={{width:48,height:70,objectFit:'cover',borderRadius:4}}/>:<div className="cover-mini">No cover</div>}<div><b>{ed.signature}</b><div className="small">{[ed.publisher,ed.year,ed.language,ed.format,ed.isbn].filter(Boolean).join(' · ')||'Edition details missing'}</div><div className="small">{edCopies.length} physical cop{edCopies.length===1?'y':'ies'}</div></div><button className="mini-action" onClick={()=>{const b=books.find(x=>ed.bookIds.includes(x.id));if(b)onEdit(b)}}>Edit source</button></div><div style={{marginTop:8,display:'grid',gap:5}}>{edCopies.map(c=><div key={c.id} className="tr" style={{gridTemplateColumns:'1fr 100px 110px'}}><span>{copyLabel(c)}<div className="small">{c.collections.join(', ')||'No custom shelf'}</div></span><span className="small">{statusLabel(c.status)}</span><span>{c.lentTo?<span className={isOverdue({lentTo:c.lentTo,dueDate:c.dueDate,returnedDate:c.returnedDate})?'chip danger':'chip warn'}>{c.lentTo}</span>:<span className="chip gray">Available</span>}</span></div>)}</div></div>})}</div></>:<div className="empty">Select a work to inspect its editions and copies.</div>}</section></div>
    {(model.ambiguousWorks.length>0||model.duplicateEditions.length>0)&&<div className="grid2" style={{marginTop:16}}><section className="panel panel-pad"><h2 style={{fontFamily:'Fraunces,serif',marginTop:0}}>Work / edition decisions</h2>{model.ambiguousWorks.slice(0,8).map(w=><div key={w.id} className="tr" style={{gridTemplateColumns:'1fr 90px'}}><span><b>{w.title}</b><div className="small">{w.editionIds.length} likely editions · {w.copyIds.length} copies</div></span><span className="chip warn">Review</span></div>)}</section><section className="panel panel-pad"><h2 style={{fontFamily:'Fraunces,serif',marginTop:0}}>Same-edition copy groups</h2>{model.duplicateEditions.slice(0,8).map(e=><div key={e.id} className="tr" style={{gridTemplateColumns:'1fr 90px'}}><span><b>{e.title}</b><div className="small">{e.signature}</div></span><span className="chip">{e.copyIds.length} copies</span></div>)}</section></div>}
  </div>;
}

function CommandPalette({open,onClose,books,collections,setActiveView,setFilters,setSearch,onAddManual,onExportJSON,onEdit}){
  const [q,setQ]=useState('');
  const [activeIndex,setActiveIndex]=useState(0);
  const inputRef=useRef(null);
  const modalRef=useRef(null);
  useModalFocus(open,onClose,modalRef);
  useEffect(()=>{if(open){setActiveIndex(0);setTimeout(()=>inputRef.current?.focus(),30)}},[open]);
  const openView=(id,label)=>({label:'Open '+label,detail:'Workspace',run:()=>setActiveView(id)});
  const actions=[openView('dashboard','Dashboard'),openView('scan','Scan'),openView('intake','Intake Queue'),openView('library','Library'),openView('bookcase','Bookcase'),openView('works','Works'),openView('locations','Locations'),openView('reports','Reports'),openView('review','Review'),openView('duplicates','Duplicates'),openView('quality','Quality'),openView('lending','Lending'),openView('stats','Stats'),openView('tags','Tags'),openView('settings','Settings'),openView('migration','Catalog Model'),openView('help','Help'),{label:'Add book manually',detail:'Create a new catalog entry',run:onAddManual},{label:'Export JSON backup',detail:'Full-fidelity local backup',run:onExportJSON},{label:'Clear search and filters',detail:'Reset Library and sidebar search',run:()=>{setSearch('');setFilters(defaultFilters);setActiveView('library')}},...BUILTIN_VIEWS.map(v=>({label:'Quick view: '+v.name,detail:'Library saved filter',run:()=>{setFilters({...defaultFilters,...v.filters});setActiveView('library')}}))];
  const needle=String(q||'').toLowerCase();
  const actionRows=actions.filter(a=>!needle||(a.label+' '+a.detail).toLowerCase().includes(needle)).map(a=>({...a,type:'Action'}));
  const bookRows=needle.length>1?books.filter(b=>matches(b,q,books)).slice(0,8).map(b=>({label:b.title,detail:[b.authors,statusLabel(b.status),locationText(b)].filter(Boolean).join(' · '),type:'Book',run:()=>onEdit(b)})):[];
  const rows=[...actionRows,...bookRows].slice(0,16);
  useEffect(()=>{setActiveIndex(i=>Math.min(Math.max(0,i),Math.max(0,rows.length-1)))},[q,rows.length]);
  const run=row=>{if(!row)return;row.run();setQ('');onClose();};
  const onKey=e=>{
    if(e.key==='ArrowDown'){e.preventDefault();setActiveIndex(i=>rows.length?Math.min(rows.length-1,i+1):0);return;}
    if(e.key==='ArrowUp'){e.preventDefault();setActiveIndex(i=>rows.length?Math.max(0,i-1):0);return;}
    if(e.key==='Home'){e.preventDefault();setActiveIndex(0);return;}
    if(e.key==='End'){e.preventDefault();setActiveIndex(Math.max(0,rows.length-1));return;}
    if(e.key==='Escape'){e.preventDefault();onClose();return;}
    if(e.key==='Enter'&&rows[activeIndex]){e.preventDefault();run(rows[activeIndex]);}
  };
  if(!open)return null;
  return <div className="modal-back" onClick={onClose} role="presentation"><div ref={modalRef} className="modal" role="dialog" aria-modal="true" aria-label="Command palette" tabIndex="-1" style={{maxWidth:720}} onClick={e=>e.stopPropagation()}><div className="modal-head"><div><div className="overline">Command Palette</div><h2 style={{fontFamily:'Fraunces,serif',margin:'2px 0 0'}}>Jump anywhere</h2></div><button className="ghost" onClick={onClose} aria-label="Close command palette"><Icon name="x" size={14}/></button></div><div className="modal-body"><input ref={inputRef} className="field" value={q} onChange={e=>{setQ(e.target.value);setActiveIndex(0)}} onKeyDown={onKey} placeholder="Type a command, view, smart search, or book title…" aria-label="Search commands and books" aria-controls="command-results" aria-activedescendant={rows[activeIndex]?'command-'+activeIndex:undefined}/><div className="small" style={{margin:'8px 0 12px'}}>Use <span className="kbd">↑</span> <span className="kbd">↓</span> and <span className="kbd">Enter</span>. Try <b>review:needs</b>, <b>cover:missing</b>, <b>lent:overdue</b>, or <b>rating&gt;=4</b>.</div><div id="command-results" role="listbox" aria-label="Command results" style={{display:'grid',gap:6}}>{rows.length?rows.map((row,i)=><button key={row.type+'-'+row.label+'-'+i} id={'command-'+i} role="option" aria-selected={i===activeIndex} className={'tr command-row '+(i===activeIndex?'active':'')} style={{gridTemplateColumns:'90px 1fr',textAlign:'left'}} onMouseEnter={()=>setActiveIndex(i)} onClick={()=>run(row)}><span className="chip gray">{row.type}</span><span><b>{row.label}</b><div className="small">{row.detail}</div></span></button>):<div className="empty">No commands or books matched.</div>}</div></div></div></div>
}

  function saveBook(book){let b=normalizeBook({...book,updatedAt:new Date().toISOString()});if(b.status==='reading'&&!b.startedAt)b={...b,startedAt:todayISO()};if(b.status==='read'){if(!b.finishedAt)b={...b,finishedAt:todayISO()};if(!b.readCount)b={...b,readCount:1};}if(b.isbn&&!isValidISBN(b.isbn)){toast(`"${b.isbn}" is not a valid ISBN`,'error');return}setBooks(p=>p.map(x=>x.id===b.id?b:x));setCollections(p=>uniq([...p,...collectionNames(b)]).filter(x=>!isAutoFacet(x)));setEditing(null);setQuickEditing(null);toast('Entry saved')}

  function deleteBooks(ids){if(!ids.length)return;if(!confirmRisk(`Delete ${ids.length} selected book${ids.length===1?'':'s'}?`,`${ids.length} selected record${ids.length===1?'':'s'} will be removed from the active catalog.`,'Unselected books, JSON backups, and app settings will not be changed.','A local safety snapshot will be created first, and this toast will include Undo.'))return;makeSnapshot('before-bulk-delete');const removed=books.filter(b=>ids.includes(b.id));setBooks(p=>p.filter(b=>!ids.includes(b.id)));toast(`Deleted ${ids.length} book${ids.length===1?'':'s'}`,'ok',{label:'Undo',onClick:()=>setBooks(p=>[...removed,...p.filter(b=>!ids.includes(b.id))])})}
  function addManual(){const chosen=activeCollection&&activeCollection!=='__unshelved__'?activeCollection:settings.defaultCollection;const col=chosen?[chosen]:[];const book=normalizeBook({title:'Untitled book',collections:col,status:settings.defaultStatus||'unread',location:normalizeLocation(settings.defaultLocation)});setBooks(p=>[book,...p]);setEditing(book);toast('Manual entry created')}
  function onDropBook(id,target,mode='move'){const book=(booksRef.current||books).filter(Boolean).find(b=>b.id===id);if(!book){toast('Could not move book: missing drag data','error');return;}target=String(target||'').trim();if(target&&isAutoFacet(target)){toast('Author, publisher, and genre facets are filters, not custom shelves','error');return;}const old=collectionNames(book);const next=mode==='add'&&target?uniq([...old,target]):(target?[target]:[]);if(old.length===next.length&&old.every((s,i)=>s===next[i])){toast(target?`Already on "${target}"`:'Already unshelved');return;}setBooks(p=>p.filter(Boolean).map(b=>b.id===id?normalizeBook(setBookCollections(b,next)):b));if(target&&!collections.includes(target))setCollections(p=>uniq([...p,target]).filter(x=>!isAutoFacet(x)));setDragging(null);toast(target?`${mode==='add'?'Added to':'Moved to'} "${target}"`:'Moved to Unshelved','ok',{label:'Undo',onClick:()=>setBooks(p=>p.filter(Boolean).map(b=>b.id===id?normalizeBook(setBookCollections(b,old)):b))})}
  function bulkIntakeUpdate(ids,changes){ids=uniq(ids||[]).filter(Boolean);if(!ids.length)return;const target=String(changes.collection||'').trim();if(target&&isAutoFacet(target)){toast('Author, publisher, and genre facets are filters, not custom shelves','error');return;}makeSnapshot('before-bulk-intake-update');const before=(booksRef.current||books).filter(b=>ids.includes(b.id)).map(b=>normalizeBook(b));setBooks(p=>p.filter(Boolean).map(b=>{if(!ids.includes(b.id))return b;let next={...b};if(target)next=setBookCollections(next,changes.mode==='add'?uniq([...collectionNames(next),target]):[target]);if(changes.status)next.status=changes.status;if(changes.reviewed!==undefined)next.reviewed=Boolean(changes.reviewed);if(changes.location){const old=normalizeLocation(next.location);next={...next,location:{...old,room:changes.location.room||old.room,bookcase:changes.location.bookcase||old.bookcase,shelf:changes.location.shelf||old.shelf,box:changes.location.box||old.box}};}return normalizeBook({...next,updatedAt:new Date().toISOString()});}));if(target&&!collections.includes(target))setCollections(p=>uniq([...p,target]).filter(x=>!isAutoFacet(x)));toast(`Updated ${ids.length} intake book${ids.length===1?'':'s'}`,'ok',{label:'Undo',onClick:()=>setBooks(p=>p.filter(Boolean).map(b=>{const old=before.find(x=>x.id===b.id);return old||b;}))})}
  function removeFromCollection(id,name){const book=(booksRef.current||books).filter(Boolean).find(b=>b.id===id);if(!book||!name)return;const old=collectionNames(book);if(!old.includes(name)){toast('Book is not on that shelf');return;}const next=old.filter(c=>c!==name);setBooks(p=>p.filter(Boolean).map(b=>b.id===id?normalizeBook(setBookCollections(b,next)):b));toast(`Removed from "${name}"`,'ok',{label:'Undo',onClick:()=>setBooks(p=>p.filter(Boolean).map(b=>b.id===id?normalizeBook(setBookCollections(b,old)):b))})}
  function renameCollection(oldName,newName){newName=String(newName||'').trim();if(!oldName||!newName||oldName===newName)return;if(isAutoFacet(newName)){toast('Author, publisher, and genre facets are filters, not custom shelves','error');return;}if(allCollections.includes(newName)&&settings.confirmDestructive&&!confirm(`Merge "${oldName}" into "${newName}"?`))return;makeSnapshot('before-rename-shelf');setCollections(p=>uniq(p.map(c=>c===oldName?newName:c)).filter(x=>!isAutoFacet(x)));setBooks(p=>p.filter(Boolean).map(b=>inCollection(b,oldName)?normalizeBook(setBookCollections(b,collectionNames(b).map(c=>c===oldName?newName:c))):b));if(activeCollection===oldName)setActiveCollection(newName);toast(`Renamed shelf to "${newName}"`)}

  function renameLocation(from,to){from=normalizeLocation(from);to=normalizeLocation(to);if(!from.room&&!from.bookcase&&!from.shelf&&!from.box){toast('Choose a source location first','error');return;}makeSnapshot('before-rename-location');let count=0;setBooks(p=>p.map(b=>{if(sameLocation(b.location,from)){count++;return normalizeBook({...b,location:{...normalizeLocation(b.location),...to}})}return b;}));toast('Updated '+count+' book'+(count===1?'':'s')+' in that location')}
  function mergeLocation(from,to){renameLocation(from,to)}
  function clearLocation(from){from=normalizeLocation(from);makeSnapshot('before-clear-location');let count=0;setBooks(p=>p.map(b=>{if(sameLocation(b.location,from)){count++;return normalizeBook({...b,location:blankLocation()})}return b;}));toast('Cleared location from '+count+' book'+(count===1?'':'s'))}
  function deleteCollection(name){const count=books.filter(b=>inCollection(b,name)).length;if(settings.confirmDestructive&&!confirm(`Delete custom shelf "${name}"? It will be removed from ${count} book${count===1?'':'s'}.`))return;makeSnapshot('before-delete-shelf');const affected=books.filter(b=>inCollection(b,name)).map(b=>b.id);setCollections(p=>p.filter(c=>c!==name));setBooks(p=>p.filter(Boolean).map(b=>inCollection(b,name)?normalizeBook(setBookCollections(b,collectionNames(b).filter(c=>c!==name))):b));if(activeCollection===name)setActiveCollection('');toast(`Deleted shelf "${name}"`,'ok',{label:'Undo',onClick:()=>{setCollections(p=>uniq([...p,name]).filter(x=>!isAutoFacet(x)));setBooks(p=>p.filter(Boolean).map(b=>affected.includes(b.id)?normalizeBook(setBookCollections(b,uniq([...collectionNames(b),name]))):b));}})}
  function importCSV(file){const r=new FileReader();r.onload=()=>{try{const incoming=csvRowsToBooks(r.result);if(!incoming.length)throw new Error('No catalog rows found');setPendingImport(buildImportPreview(books,{books:incoming,collections:incoming.flatMap(collectionNames)},'CSV import'));}catch(err){toast(`Could not preview this CSV: ${err?.message||'invalid CSV'}`,'error')}};r.onerror=()=>toast('Could not read this CSV','error');r.readAsText(file)}
  function applyPendingImport(mode){if(!pendingImport)return;makeSnapshot(`before-${mode}-import`);if(mode==='replace'){const p=pendingImport.replacePayload;setBooks(p.books);setCollections(p.collections);setSavedViews(Array.isArray(p.savedViews)?p.savedViews:[]);if(p.settings)setSettings(normalizeSettings(p.settings));toast(`Replaced catalog with ${p.books.length} book${p.books.length===1?'':'s'}`);}else{const p=pendingImport.mergePayload;if(!p.books.length){toast('No new books to merge','error');setPendingImport(null);return}setBooks(cur=>[...p.books,...cur]);setCollections(cur=>uniq([...cur,...p.collections]).filter(x=>!isAutoFacet(x)));toast(`Merged ${p.books.length} new book${p.books.length===1?'':'s'}`);}setPendingImport(null);}
  function markReviewed(ids){ids=Array.isArray(ids)?ids:[ids];setBooks(p=>p.map(b=>ids.includes(b.id)?{...b,reviewed:true,updatedAt:new Date().toISOString()}:b));toast(`Marked ${ids.length} book${ids.length===1?'':'s'} reviewed`)}
  async function findMetadataSuggestion(book){
    const candidates=await lookupMetadataCandidates(book);
    return candidates[0]||null;
  }
  async function previewMetadata(id){
    const current=booksRef.current.find(b=>b.id===id);if(!current){toast('Could not find that record','error');return;}
    toast('Searching metadata candidates for '+(current.title||current.isbn||'record')+'…');
    const candidates=await lookupMetadataCandidates(current);
    if(!candidates.length){toast('No metadata candidates found for '+(current.title||current.isbn||'record'),'error');return;}
    setPendingMetadata({id:genId(),book:current,meta:candidates[0],candidates});
  }
  function applyMetadataPreview(mode,fields,metaOverride){
    if(!pendingMetadata)return;
    const {book}=pendingMetadata;const meta=metaOverride||pendingMetadata.meta;makeSnapshot('before-metadata-update');
    setBooks(p=>p.map(b=>b.id===book.id?applyMetadataToBook(b,meta,fields,mode):b));
    setPendingMetadata(null);
    toast('Updated metadata for '+book.title+' from '+(meta.metadataSource||'external source'));
  }
  async function enrichBook(id,replace=false){
    const current=booksRef.current.find(b=>b.id===id);if(!current)return false;
    const meta=await findMetadataSuggestion(current);
    if(!meta){toast('No metadata found for '+(current.title||current.isbn||'record'),'error');return false;}
    setBooks(p=>p.map(b=>b.id===id?applyMetadataToBook(b,meta,[],replace?'replace':'missing'):b));
    toast('Filled missing metadata for '+current.title+' via '+(meta.metadataSource||'external source'));
    return true;
  }
  async function enrichMany(ids){ids=uniq(ids);let ok=0;for(const id of ids){const done=await enrichBook(id,false);if(done)ok++;}if(ids.length>1)toast(`Metadata fill-missing complete: ${ok}/${ids.length} updated`)}
  function fillMissingCovers(ids){ids=uniq(ids);let count=0;setBooks(p=>p.map(b=>{if(!ids.includes(b.id)||b.cover||!b.isbn||!isValidISBN(b.isbn))return b;count++;return normalizeBook({...b,cover:coverUrlFromISBN(b.isbn),updatedAt:new Date().toISOString()});}));toast(`Filled ${count} ISBN cover URL${count===1?'':'s'}`)}
  function bulkUpdate(ids,changes){setBooks(p=>p.map(b=>{if(!ids.includes(b.id))return b;let next={...b};if(changes.status)next.status=changes.status;if(changes.reviewed!==undefined)next.reviewed=changes.reviewed;if(changes.addCollection)next=setBookCollections(next,uniq([...collectionNames(next),changes.addCollection]));if(changes.addTag)next={...next,tags:uniq([...(next.tags||[]),changes.addTag])};if(changes.location){const old=normalizeLocation(next.location);next={...next,location:{...old,room:changes.location.room||old.room,bookcase:changes.location.bookcase||old.bookcase,shelf:changes.location.shelf||old.shelf}};}return normalizeBook({...next,updatedAt:new Date().toISOString()});}));toast(`Updated ${ids.length} selected book${ids.length===1?'':'s'}`)}
  function mergeGroup(primaryId,removeIds){const primary=books.find(b=>b.id===primaryId);const others=books.filter(b=>removeIds.includes(b.id));if(!primary||!others.length)return;if(!confirmRisk(`Merge ${others.length+1} records into "${primary.title}"?`,`${others.length+1} records will become one combined record. The duplicate source records will be removed from the active catalog.`,'Other duplicate groups and JSON backup files will not be changed.','A local safety snapshot will be created before merging.'))return;makeSnapshot('before-merge-duplicates');const merged=mergeBookRecords(primary,others);setBooks(p=>[merged,...p.filter(b=>b.id!==primaryId&&!removeIds.includes(b.id))]);setCollections(p=>uniq([...p,...collectionNames(merged)]));toast(`Merged duplicate group into "${merged.title}"`)}
  function mergeCustomRecord(merged,removeIds){if(!merged||!removeIds?.length)return;if(!confirmRisk(`Merge selected records into "${merged.title}"?`,'Your selected field choices will become one combined record. The duplicate source records will be removed from the active catalog.','Other catalog records and JSON backup files will not be changed.','A local safety snapshot will be created before merging.'))return;makeSnapshot('before-field-merge');const clean=normalizeBook(merged);setBooks(p=>[clean,...p.filter(b=>b.id!==clean.id&&!removeIds.includes(b.id))]);setCollections(p=>uniq([...p,...collectionNames(clean)]));toast(`Merged records into "${clean.title}"`)}
  function renameTag(oldTag,newTag){newTag=String(newTag||'').trim();if(!oldTag||!newTag){toast('Enter a valid tag name','error');return;}makeSnapshot('before-rename-tag');setBooks(p=>p.filter(Boolean).map(b=>normalizeBook({...b,tags:uniq((b.tags||[]).map(t=>t===oldTag?newTag:t))})));toast(`Renamed tag to "${newTag}"`)}
  function mergeTag(oldTag,target){target=String(target||'').trim();if(!oldTag||!target||oldTag===target){toast('Choose a different target tag','error');return;}makeSnapshot('before-merge-tag');setBooks(p=>p.filter(Boolean).map(b=>normalizeBook({...b,tags:(b.tags||[]).includes(oldTag)?uniq((b.tags||[]).map(t=>t===oldTag?target:t)):b.tags})));toast(`Merged "${oldTag}" into "${target}"`)}
  function deleteTag(tag){if(!tag)return;makeSnapshot('before-delete-tag');setBooks(p=>p.filter(Boolean).map(b=>normalizeBook({...b,tags:(b.tags||[]).filter(t=>t!==tag)})));toast(`Deleted tag "${tag}"`)}
  function returnLoan(id){setBooks(p=>p.map(b=>b.id===id?{...b,returnedDate:todayISO(),updatedAt:new Date().toISOString()}:b));toast('Marked book returned')}
  function repairCatalog(){makeSnapshot('before-repair');const repaired=repairCatalogData(booksRef.current||books,collections);setBooks(repaired.books);setCollections(repaired.collections);toast(`Catalog repaired: ${repaired.books.length} book${repaired.books.length===1?'':'s'} checked, shelves rebuilt, duplicate IDs fixed`)}
  function rebuildCollections(){makeSnapshot('before-rebuild-shelves');setCollections(uniq(books.flatMap(collectionNames)).filter(x=>!isAutoFacet(x)).sort((a,b)=>a.localeCompare(b)));toast('Custom shelf list rebuilt')}
  function purgeEmptyCollections(){makeSnapshot('before-purge-empty-shelves');const used=new Set(books.flatMap(collectionNames));const removed=collections.filter(c=>!used.has(c)).length;setCollections(p=>p.filter(c=>used.has(c)));toast(`Removed ${removed} empty shelf${removed===1?'':'s'}`)}
  function clearSavedViews(){if(settings.confirmDestructive&&!confirm('Clear all saved custom views?'))return;makeSnapshot('before-clear-views');setSavedViews([]);toast('Saved views cleared')}

  function loadDemoLibrary(){makeSnapshot('before-load-demo');const demo=makeDemoBooks();setBooks(p=>{const existing=new Set(p.map(b=>b.title+'|'+b.authors));const add=demo.filter(b=>!existing.has(b.title+'|'+b.authors));return [...add,...p];});setCollections(p=>uniq([...p,'Favorites','Science Fiction','Reference','To Process','Fantasy']).filter(x=>!isAutoFacet(x)));setActiveView('library');toast('Demo library loaded');}
  function clearDemoLibrary(){const demoIds=new Set(books.filter(b=>b.demo).map(b=>b.id));if(!demoIds.size){toast('No demo books found');return;}makeSnapshot('before-clear-demo');const remaining=books.filter(b=>!demoIds.has(b.id));setBooks(remaining);setCollections(p=>p.filter(c=>remaining.some(b=>inCollection(b,c))));toast('Demo books removed');}
  const collectionFiltered=useMemo(()=>books.filter(b=>b&&typeof b==='object').filter(b=>activeCollection===''?true:activeCollection==='__unshelved__'?isUnshelved(b):inCollection(b,activeCollection)),[books,activeCollection]);
  const filteredBooks=useMemo(()=>filterBooks(books.filter(Boolean),filters),[books,filters]);
  return <div className="app"><Sidebar books={books} collections={allCollections} activeView={activeView} setActiveView={setActiveView} activeCollection={activeCollection} setActiveCollection={setActiveCollection} isDragging={!!dragging} onDropBook={onDropBook} search={search} setSearch={setSearch} onScan={onScan} loaded={loaded} onAddManual={addManual} onImport={importCSV} onExport={doExport} onExportJSON={exportJSON} onImportJSON={importJSON} onOpenCommand={()=>setShowCommand(true)} onOpenChangelog={()=>setShowChangelog(true)} onAddCollection={addCollection} onRenameCollection={renameCollection} onDeleteCollection={deleteCollection}/><main className="main" id="main-content" tabIndex="-1">{activeView!=='dashboard'&&<OnboardingPanel books={books} collections={allCollections} setActiveView={setActiveView} onAddManual={addManual} onExportJSON={exportJSON} onLoadDemo={loadDemoLibrary}/>}<RiskSafetyRail activeView={activeView} books={books} settings={settings} onExportJSON={exportJSON}/>{activeView==='dashboard'&&<DashboardView books={books} collections={allCollections} savedViews={savedViews} setActiveView={setActiveView} setFilters={setFilters} onExportJSON={exportJSON} onImportJSON={importJSON} settings={settings} onAddManual={addManual} onLoadDemo={loadDemoLibrary}/>} {activeView==='scan'&&<ScanDesk books={books} collections={allCollections} activeCollection={activeCollection} setActiveCollection={setActiveCollection} onScan={onScan} onAddManual={addManual} onEdit={setEditing} onDeleteIds={deleteBooks} settings={settings} setSettings={setSettings}/>} {activeView==='intake'&&<IntakeQueueView books={books} collections={allCollections} onEdit={setEditing} onBulkIntakeUpdate={bulkIntakeUpdate} setActiveView={setActiveView} setFilters={setFilters}/>} {activeView==='library'&&<LibraryView books={books} collections={allCollections} filters={filters} setFilters={setFilters} savedViews={savedViews} setSavedViews={setSavedViews} onEdit={setEditing} onQuickEdit={setQuickEditing} onExport={doExport} onBulkUpdate={bulkUpdate} onBulkDelete={deleteBooks} onBulkRetryMetadata={enrichMany}/>} {activeView==='cleanup'&&<CleanupAssistantView books={books} setActiveView={setActiveView} setFilters={setFilters} onExportJSON={exportJSON}/>} {activeView==='review'&&<NeedsReviewView books={books} onEdit={setEditing} onMarkReviewed={markReviewed} onRetryMetadata={enrichMany} onPreviewMetadata={previewMetadata} onGoDuplicates={()=>setActiveView('duplicates')}/>} {activeView==='duplicates'&&<DuplicateReviewView books={books} onEdit={setEditing} onMergeGroup={mergeGroup} onMergeCustom={mergeCustomRecord} onDeleteIds={deleteBooks}/>} {activeView==='quality'&&<QualityView books={books} onEdit={setEditing} onRetryMetadata={enrichMany} onPreviewMetadata={previewMetadata} onFillCovers={fillMissingCovers} onMarkReviewed={markReviewed} onOpenDuplicates={()=>setActiveView('duplicates')}/>} {activeView==='lending'&&<LendingView books={books} onEdit={setEditing} onReturn={returnLoan}/>} {activeView==='stats'&&<StatsDashboard books={books}/>} {activeView==='locations'&&<LocationsView books={books} setActiveView={setActiveView} setFilters={setFilters} onRenameLocation={renameLocation} onMergeLocation={mergeLocation} onClearLocation={clearLocation}/>} {activeView==='reports'&&<ReportsView books={books} filteredBooks={filteredBooks} setActiveView={setActiveView} setFilters={setFilters} onExportJSON={exportJSON}/>} {activeView==='bookcase'&&<BookcaseView books={books} collections={allCollections} activeCollection={activeCollection} search={debouncedSearch} onEdit={setEditing} onDropBook={onDropBook} setDragging={setDragging} onAddCollection={addCollection} setActiveCollection={setActiveCollection} onRemoveFromCollection={removeFromCollection} onOpenSettings={()=>setActiveView('settings')}/>} {activeView==='works'&&<WorksView books={books} onEdit={setEditing} onApplyV3={applyV3Migration} onExportV3={exportV3Model} onPrintV3={printV3Model} setActiveView={setActiveView} setFilters={setFilters}/>} {activeView==='tags'&&<TagManager books={books} onRename={renameTag} onMerge={mergeTag} onDelete={deleteTag}/>} {activeView==='help'&&<HelpView setActiveView={setActiveView} setFilters={setFilters} onOpenCommand={()=>setShowCommand(true)}/>} {activeView==='migration'&&<MigrationSafetyPanel books={books} collections={allCollections} savedViews={savedViews} settings={settings} onCreateBackup={createMigrationBackup} onRestoreBackup={restoreMigrationBackup} onExportPlan={exportMigrationPlan} backupInfo={migrationBackupInfo()}/>} {activeView==='settings'&&<><MinimalToolsPanel setActiveView={setActiveView} setFilters={setFilters} onExportJSON={exportJSON}/><SettingsView books={books} collections={allCollections} savedViews={savedViews} settings={settings} setSettings={setSettings} onExportJSON={exportJSON} onImportJSON={importJSON} onRestoreSnapshot={restoreSnapshot} onRepair={repairCatalog} onRebuildCollections={rebuildCollections} onClearSavedViews={clearSavedViews} onDownloadCSV={doExport} onPurgeEmptyCollections={purgeEmptyCollections} onLoadDemo={loadDemoLibrary} onClearDemo={clearDemoLibrary} demoCount={books.filter(b=>b.demo).length}/><StorageModePanel storageMode={storageMode} storageInfo={storageInfo} onEnableIndexedDB={enableIndexedDBMode} onUseLocalStorage={useLocalStorageMode} onRepairIndexedDB={repairIndexedDB} books={books} collections={allCollections} savedViews={savedViews} settings={settings}/><MigrationSafetyPanel books={books} collections={allCollections} savedViews={savedViews} settings={settings} onCreateBackup={createMigrationBackup} onRestoreBackup={restoreMigrationBackup} onExportPlan={exportMigrationPlan} backupInfo={migrationBackupInfo()}/></>}</main>{editing&&<EditModal book={editing} collections={allCollections} onSave={saveBook} onDelete={deleteBook} onClose={()=>setEditing(null)} onPreviewMetadata={previewMetadata}/>} {showChangelog&&<ChangelogModal onClose={()=>setShowChangelog(false)}/>} {pendingImport&&<ImportPreviewModal preview={pendingImport} onCancel={()=>setPendingImport(null)} onApply={applyPendingImport}/>} {pendingMetadata&&<MetadataPreviewModal preview={pendingMetadata} onCancel={()=>setPendingMetadata(null)} onApply={applyMetadataPreview}/>} {quickEditing&&<QuickEditDrawer book={quickEditing} collections={allCollections} onClose={()=>setQuickEditing(null)} onSave={saveBook} onPreviewMetadata={previewMetadata}/>}<CommandPalette open={showCommand} onClose={()=>setShowCommand(false)} books={books} collections={allCollections} setActiveView={setActiveView} setFilters={setFilters} setSearch={setSearch} onAddManual={addManual} onExportJSON={exportJSON} onEdit={setEditing}/><Toasts toasts={toasts}/></div>;
}
class StartupErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(error){return {error};}
  render(){if(this.state.error){return <div style={{padding:24,fontFamily:'system-ui, sans-serif',background:'#f6fbff',color:'#14324a',minHeight:'100vh'}}><h1 style={{color:'#dc5252'}}>The Stacks could not render</h1><p>{String(this.state.error?.message||this.state.error)}</p><p style={{color:'#516b80'}}>Your saved catalog data has not been deleted. This diagnostic screen is shown instead of a blank page.</p></div>;}return this.props.children;}
}
