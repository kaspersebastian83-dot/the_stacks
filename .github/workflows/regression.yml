name: Regression tests

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use current Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Run regression suites
        run: node tests/run-all.js
